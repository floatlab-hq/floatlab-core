version: '3.9'

# FloatLab development stack.
# Requires Docker with ZFS support on the host for floatlab-hostd.
# Usage: docker compose up --build

services:

  # ── Persistent state ────────────────────────────────────────────────────────

  rqlite:
    image: rqlite/rqlite:8.26.0
    restart: unless-stopped
    command: -raft-addr=rqlite:4002 -raft-adv-addr=rqlite:4002
    ports:
      - "4001:4001"
    volumes:
      - rqlite_data:/rqlite/file
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Observability ────────────────────────────────────────────────────────────

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    restart: unless-stopped
    command:
      - -storageDataPath=/vmdata
      - -retentionPeriod=90d
      - -memory.allowedPercent=60
    environment:
      GOGC: "40"
    ports:
      - "8428:8428"
    volumes:
      - vm_data:/vmdata
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  victorialogs:
    image: victoriametrics/victoria-logs:v0.28.0-victorialogs
    restart: unless-stopped
    command:
      - -storageDataPath=/vldata
      - -retentionPeriod=30d
    ports:
      - "9428:9428"
    volumes:
      - vl_data:/vldata
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9428/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vmalert:
    image: victoriametrics/vmalert:v1.101.0
    restart: unless-stopped
    command:
      - -datasource.url=http://victoriametrics:8428
      - -remoteRead.url=http://victoriametrics:8428
      - -remoteWrite.url=http://victoriametrics:8428
      - -notifier.url=http://floatlab-control:8080/api/v1/stats/webhook
      - -rule=/etc/vmalert/rules/*.yaml
      - -evaluationInterval=30s
    volumes:
      - ./vmalert-rules:/etc/vmalert/rules:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
      floatlab-control:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8880/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── FloatLab control plane ───────────────────────────────────────────────────

  floatlab-control:
    build:
      context: .
      dockerfile: docker/floatlab-control.Dockerfile
    restart: unless-stopped
    command:
      - --listen=:8080
      - --rqlite-url=http://rqlite:4001
      - --raft-id=${RAFT_ID:-node1}
      - --raft-bind=0.0.0.0:7000
      - --raft-advertise=${RAFT_ADVERTISE:-floatlab-control:7000}
      - --raft-data=/var/lib/floatlab/raft
      - --raft-bootstrap=${RAFT_BOOTSTRAP:-true}
      - --vlogs-url=http://victorialogs:9428
      - --vmetrics-url=http://victoriametrics:8428
    ports:
      - "8080:8080"
      - "7000:7000"
    volumes:
      - raft_data:/var/lib/floatlab/raft
    depends_on:
      rqlite:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── FloatLab host daemon ─────────────────────────────────────────────────────
  # Requires: privileged mode + ZFS kernel modules on host.
  # For integration testing only — not needed for API/UI development.

  floatlab-hostd:
    build:
      context: .
      dockerfile: docker/floatlab-hostd.Dockerfile
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/floatlab:/run/floatlab
    depends_on:
      floatlab-control:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/floatlab/hostd.sock"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles:
      - integration

volumes:
  rqlite_data:
  vm_data:
  vl_data:
  raft_data:
