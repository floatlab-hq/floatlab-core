services:
  rqlite:
    image: rqlite/rqlite:8.26.0
    command: -raft-addr=rqlite:4002 -raft-adv-addr=rqlite:4002
    volumes:
      - /floatlab/system/rqlite:/rqlite/file
    restart: unless-stopped

  victoria-metrics:
    image: ${VICTORIA_METRICS_IMAGE:-victoriametrics/victoria-metrics:latest}
    command:
      - -storageDataPath=/victoria-metrics-data
      - -httpListenAddr=:8428
    ports:
      - "8428:8428"
    volumes:
      - /floatlab/system/metrics/victoria-metrics:/victoria-metrics-data
    restart: unless-stopped

  victoria-logs:
    image: ${VICTORIA_LOGS_IMAGE:-victoriametrics/victoria-logs:latest}
    command:
      - -storageDataPath=/victoria-logs-data
      - -httpListenAddr=:9428
    ports:
      - "9428:9428"
    volumes:
      - /floatlab/system/logs/victoria-logs:/victoria-logs-data
    restart: unless-stopped

  floatlab-api:
    image: ${FLOATLAB_API_IMAGE:-floatlab-api:local}
    environment:
      FLOATLAB_AGENT_SOCKET: /run/floatlab/agent.sock
      FLOATLAB_RQLITE_URL: http://rqlite:4001
      VICTORIA_METRICS_URL: http://victoria-metrics:8428
      VICTORIA_LOGS_URL: http://victoria-logs:9428
    ports:
      - "8080:8080"
    volumes:
      - /run/floatlab/agent.sock:/run/floatlab/agent.sock
      - /var/run/docker.sock:/var/run/docker.sock
      - /floatlab:/floatlab
    depends_on:
      - victoria-metrics
      - victoria-logs
      - rqlite
    restart: unless-stopped
