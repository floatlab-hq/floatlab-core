openapi: 3.0.3
info:
  title: FloatLab Host Daemon API
  version: 0.0.1
  description: Local Unix-socket API used by the FloatLab API server for privileged host operations.
servers:
  - url: unix:///run/floatlab/agent.sock
paths:
  /healthz:
    get:
      summary: Check daemon health
      responses:
        '200':
          description: Daemon is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /setup/checks:
    get:
      summary: Check host setup prerequisites
      description: Verifies Docker, Docker Compose, ZFS, and the `floatlab` ZFS dataset are available before system bootstrap.
      responses:
        '200':
          description: Host setup is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupReport'
        '503':
          description: One or more host setup checks failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupReport'
  /zfs/bootstrap:
    $ref: './zfs.yaml#/paths/~1zfs~1bootstrap'
  /zfs/datasets:
    $ref: './zfs.yaml#/paths/~1zfs~1datasets'
  /zfs/dataset:
    $ref: './zfs.yaml#/paths/~1zfs~1dataset'
  /zfs/dataset/{dataset}:
    $ref: './zfs.yaml#/paths/~1zfs~1dataset~1{dataset}'
  /zfs/snapshots/{dataset}:
    $ref: './zfs.yaml#/paths/~1zfs~1snapshots~1{dataset}'
  /zfs/snapshot/{target}:
    $ref: './zfs.yaml#/paths/~1zfs~1snapshot~1{target}'
  /zfs/send/{target}:
    $ref: './zfs.yaml#/paths/~1zfs~1send~1{target}'
  /zfs/receive/{dataset}:
    $ref: './zfs.yaml#/paths/~1zfs~1receive~1{dataset}'
  /docker/{dockerApiPath}:
    parameters:
      - name: dockerApiPath
        in: path
        required: true
        description: Docker Engine API path, proxied to `/var/run/docker.sock`.
        schema:
          type: string
        style: simple
        explode: false
    get:
      summary: Proxy a Docker Engine API GET request
      responses:
        '200':
          description: Docker Engine API response
    post:
      summary: Proxy a Docker Engine API POST request
      responses:
        '200':
          description: Docker Engine API response
    delete:
      summary: Proxy a Docker Engine API DELETE request
      responses:
        '200':
          description: Docker Engine API response
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    SetupReport:
      type: object
      required:
        - ok
        - checks
      properties:
        ok:
          type: boolean
        checks:
          type: array
          items:
            $ref: '#/components/schemas/SetupCheck'
    SetupCheck:
      type: object
      required:
        - name
        - ok
        - message
      properties:
        name:
          type: string
          enum:
            - docker
            - docker-compose
            - zfs
            - floatlab-zfs-dataset
        ok:
          type: boolean
        message:
          type: string
