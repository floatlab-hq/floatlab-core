openapi: 3.0.3
info:
  title: FloatLab Stacks API
  version: 0.1.0

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 administrator JWT. The token requires a subject and an `admin` role.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 255
      description: Unique key used to safely retry this mutation.
  schemas:
    StackState:
      type: string
      enum:
        - Provisioning
        - Idle
        - Starting
        - RunningPrimary
        - FailingOver
        - RunningBackup
        - Restoring
        - Stopping
        - Updating
        - RollingBack
        - Failed
      description: Current lifecycle state of the stack.

    FailoverMode:
      type: string
      enum: [manual, auto]

    Stack:
      type: object
      required: [id, name, state, primary_node, compose_file, dataset_path, failover_mode, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "plex"
        state:
          $ref: '#/components/schemas/StackState'
        primary_node:
          type: string
          description: Node ID of the primary host.
          example: "node-alpha"
        secondary_node:
          type: string
          nullable: true
          description: Node ID of the failover host.
          example: "node-beta"
        compose_file:
          type: string
          description: Raw docker-compose.yml content (includes x-fl-* extensions).
        dataset_path:
          type: string
          description: ZFS dataset path — e.g. floatlab/plex
          example: "floatlab/plex"
        failover_mode:
          $ref: '#/components/schemas/FailoverMode'
        auto_trigger_after:
          type: string
          description: Duration string, only used when failover_mode=auto.
          example: "120s"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StackCreate:
      type: object
      required: [name, primary_node, compose_file]
      properties:
        name:
          type: string
        primary_node:
          type: string
        secondary_node:
          type: string
          nullable: true
        compose_file:
          type: string
        failover_mode:
          $ref: '#/components/schemas/FailoverMode'
          default: manual
        auto_trigger_after:
          type: string
          default: "120s"

    ComposeUpdate:
      type: object
      required: [compose_file]
      properties:
        compose_file:
          type: string

    StackUpgrade:
      type: object
      required: [images]
      properties:
        images:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          description: Compose service names mapped to replacement image references.

    Operation:
      type: object
      required: [operation_id, action, actor, state, checkpoint, created_at, updated_at]
      properties:
        operation_id:
          type: string
          format: uuid
        stack_id:
          type: string
          format: uuid
        action:
          type: string
        actor:
          type: string
        state:
          type: string
          enum: [pending, running, succeeded, failed]
        checkpoint:
          type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ContainerStatus:
      type: string
      enum: [running, stopped, starting, paused, error]

    Container:
      type: object
      required: [id, name, image, status, node_id, stack_id]
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        status:
          $ref: '#/components/schemas/ContainerStatus'
        health:
          type: string
          enum: [healthy, unhealthy, starting, none]
        node_id:
          type: string
        stack_id:
          type: string
          format: uuid
        cpu_pct:
          type: number
          format: float
          description: CPU usage 0–100.
        mem_bytes:
          type: integer
          format: int64
        mem_limit:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
          nullable: true

    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string
        code:
          type: string

paths:
  /stacks:
    get:
      summary: List all stacks
      operationId: listStacks
      tags: [stacks]
      responses:
        '200':
          description: List of all stacks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stack'
    post:
      summary: Create a stack
      operationId: createStack
      tags: [stacks]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StackCreate'
      responses:
        '201':
          description: Stack created; dataset provisioned; state=Provisioning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stack'
        '400':
          description: Invalid request body or compose_file validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stack name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stacks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a stack by ID
      operationId: getStack
      tags: [stacks]
      responses:
        '200':
          description: Stack detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stack'
        '404':
          description: Stack not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a stack
      operationId: deleteStack
      tags: [stacks]
      description: Stops the stack and removes active metadata. The project dataset and configuration are retained unless purged.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: purge
          in: query
          schema:
            type: boolean
            default: false
          description: Also destroy the ZFS dataset and all snapshots.
      responses:
        '202':
          description: Delete operation accepted.
        '409':
          description: Stack is not in a deletable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stacks/{id}/compose:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Update the compose file for a stack
      operationId: updateStackCompose
      tags: [stacks]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeUpdate'
      responses:
        '200':
          description: Compose file updated. Stack state unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stack'
        '400':
          description: Compose validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stacks/{id}/start:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Create or update and start a stack
      operationId: startStack
      tags: [stacks]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/yaml:
            schema: {type: string}
          application/x-yaml:
            schema: {type: string}
          application/x-tar:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Start accepted; state transitions asynchronously.
        '409':
          description: Stack is not in a startable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stacks/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Stop a stack (RunningPrimary → Stopping → Idle)
      operationId: stopStack
      tags: [stacks]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Stop accepted.
        '409':
          description: Stack is not in a stoppable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stacks/{id}/upgrade:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Upgrade selected service images with automatic rollback
      operationId: upgradeStack
      tags: [stacks]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StackUpgrade'
      responses:
        '202':
          description: Upgrade accepted. The Location header identifies the resumable operation.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [stack_id, state, operation_id]
                properties:
                  stack_id:
                    type: string
                    format: uuid
                  state:
                    $ref: '#/components/schemas/StackState'
                  operation_id:
                    type: string
                    format: uuid
        '409':
          description: Stack is not running on its primary node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stacks/{id}/failover:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Trigger manual failover (RunningPrimary → FailingOver → RunningBackup)
      operationId: triggerFailover
      tags: [stacks]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Failover accepted.
        '409':
          description: Stack is not in RunningPrimary state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stacks/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Restore primary (RunningBackup → Restoring → RunningPrimary)
      operationId: restoreStack
      tags: [stacks]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Restore accepted.
        '409':
          description: Stack is not in RunningBackup state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stacks/{id}/state:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get current state of a stack
      operationId: getStackState
      tags: [stacks]
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    $ref: '#/components/schemas/StackState'

  /stacks/{id}/containers:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List containers for a stack (across all nodes)
      operationId: getStackContainers
      tags: [stacks]
      responses:
        '200':
          description: List of containers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Container'

  /stacks/{id}/containers/{containerId}/terminal:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: containerId
        in: path
        required: true
        schema:
          type: string
      - name: rows
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 4096
          default: 24
      - name: cols
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 4096
          default: 80
      - name: command
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
    get:
      summary: Open an interactive container terminal
      description: Upgrades to WebSocket. Binary messages carry terminal bytes; text JSON messages with `type=resize`, `rows`, and `cols` resize the TTY.
      operationId: openStackTerminal
      tags: [stacks]
      responses:
        '101':
          description: WebSocket terminal established.
        '404':
          description: Stack or container not found.

  /operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get durable operation progress
      operationId: getOperation
      tags: [operations]
      responses:
        '200':
          description: Current operation state and checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '404':
          description: Operation not found.

  /stacks/{id}/restart:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Restart a running stack
      operationId: restartStack
      tags: [stacks]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Restart operation accepted.}
        '409': {description: Stack is not running.}

  /stacks/{id}/status:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Get lifecycle, operation, network, and container status
      operationId: getStackStatus
      tags: [stacks]
      responses:
        '200': {description: Combined stack status.}

  /stacks/{id}/config:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Get canonical source Compose configuration
      operationId: getStackConfig
      tags: [stacks]
      responses:
        '200':
          description: Canonical Compose YAML.
          content:
            application/yaml: {schema: {type: string}}

  /stacks/{id}/snapshots:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: List stack snapshots and recovery points
      operationId: listStackSnapshots
      tags: [stacks]
      responses:
        '200': {description: Stack snapshots.}
    post:
      summary: Create a recursive whole-stack snapshot
      operationId: createStackSnapshot
      tags: [stacks]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Snapshot operation accepted.}

  /stacks/{id}/snapshots/{snapshotId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: snapshotId, in: path, required: true, schema: {type: string}}
    delete:
      summary: Delete a snapshot or recovery point
      operationId: deleteStackSnapshot
      tags: [stacks]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Deletion operation accepted.}

  /stacks/{id}/alerts:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: List configured alert rules and current states
      operationId: listStackAlerts
      tags: [stacks]
      responses:
        '200': {description: Alert rules and status.}

  /stacks/{id}/events:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: after, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    get:
      summary: List durable lifecycle events using cursor pagination
      operationId: listStackEvents
      tags: [stacks]
      responses:
        '200': {description: Event page and next cursor.}

  /internal/alerts/transition:
    post:
      summary: Atomically update alert status and append its history event
      operationId: transitionStackAlert
      tags: [internal]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule_id, state, observed, observed_at]
              properties:
                rule_id: {type: string, format: uuid}
                state: {type: string, enum: [pending, firing, resolved]}
                observed: {type: number}
                observed_at: {type: string, format: date-time}
      responses:
        '204': {description: Alert state and event committed.}
