name: CI

on:
  push:
    branches: [main, Testing]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install TypeScript workspace
        run: pnpm install --frozen-lockfile

      - name: Validate OpenCLI contracts and generated completions
        run: pnpm commands:check

      - name: Report API command coverage
        run: |
          pnpm commands:coverage
          cat dist/command-coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: command-coverage
          path: dist/command-coverage/

      - name: Install completion test shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - uses: hustcer/setup-nu@v3
        with:
          version: '0.116.1'

      - name: Test all five shell adapters
        env:
          REQUIRE_COMPLETION_SHELLS: '1'
        run: bun test cli/test/completion-shells.test.ts

      - name: Generate shared API schema
        run: pnpm --filter @floatlab/client generate:api && git diff --exit-code -- packages/floatlab-client/src/schema.d.ts

      - name: Generate UI form contracts
        run: pnpm --dir ui forms:sync && git diff --exit-code -- ui/src/forms/core-forms.json

      - name: Typecheck and test TypeScript workspace
        run: pnpm --filter @floatlab/client typecheck && pnpm --filter floatlab-cli typecheck && pnpm --recursive test

      - name: Build and test standalone lab binary
        run: |
          pnpm build:cli
          test "$(dist/lab --version)" = dev
          dist/lab --help
          FLOATLAB_TEST_BINARY="$PWD/dist/lab" bun test cli/test/

      - uses: actions/upload-artifact@v4
        with:
          name: lab-linux-x64
          path: dist/lab

      - name: Check UI
        run: pnpm --dir ui lint && pnpm --dir ui typecheck && pnpm --dir ui storybook:build

      - name: Test release tag validation
        run: bash scripts/check-release-tag.test.sh

      - name: Test release metadata and offline bundle assembly
        run: python3 scripts/release_test.py

      - name: Test installer answers discovery and VM launchers
        run: |
          python3 floatlab-appliance-image/tests/installer-answers.py floatlab-appliance-image/nixos/modules/installer-answers.sh
          python3 floatlab-appliance-image/tests/vm-harness.py

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./pkg/... ./internal/... ./api/openapi ./integration

      - name: Compile appliance integration binaries without C bindings
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go test -c -o "$RUNNER_TEMP/floatlab-integration.test" ./integration
          go test -c -tags=appliance,integrationcoverage -cover -covermode=atomic -coverpkg=./... -o "$RUNNER_TEMP/floatlab-host-upgrade.test" ./internal/hostupgrade
          go test -c -tags=appliance,integrationcoverage -cover -covermode=atomic -coverpkg=./... -o "$RUNNER_TEMP/floatlab-management-update.test" ./internal/managementupdate
