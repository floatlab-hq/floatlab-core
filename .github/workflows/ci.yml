name: CI

on:
  push:
    branches: [main, Testing]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: [self-hosted, docker04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build floatlab-control
        run: go build -v ./cmd/floatlab-control/...

      - name: Build floatlab-hostd
        run: go build -v ./cmd/floatlab-hostd/...

      - name: Test
        run: go test -race -count=1 ./pkg/...
