name: CI

on:
  push:
    branches: [main, Testing]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build-and-test:
    runs-on: [self-hosted, docker04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install TypeScript workspace
        run: pnpm install --frozen-lockfile

      - name: Generate shared API schema
        run: pnpm --filter @floatlab/client generate:api && git diff --exit-code -- packages/floatlab-client/src/schema.d.ts

      - name: Generate UI form contracts
        run: pnpm --dir ui forms:sync && git diff --exit-code -- ui/src/forms/core-forms.json

      - name: Typecheck and test TypeScript workspace
        run: pnpm --filter @floatlab/client typecheck && pnpm --filter floatlab-cli typecheck && pnpm --recursive test

      - name: Check UI
        run: pnpm --dir ui lint && pnpm --dir ui typecheck

      - name: Test release tag validation
        run: bash scripts/check-release-tag.test.sh

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./pkg/... ./internal/... ./api/openapi ./integration
