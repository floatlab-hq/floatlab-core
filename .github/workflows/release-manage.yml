name: Release management
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing management release tag to publish
        type: string
        required: true
  workflow_call:
    inputs:
      prerelease:
        type: boolean
        required: true
    secrets:
      DOCKERHUB_NAMESPACE:
        required: false
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
permissions:
  contents: write
  packages: write
jobs:
  manage:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate publication configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_NAMESPACE }}
        run: |
          [[ "$RELEASE_TAG" == manage-v* ]]
          bash scripts/check-release-tag.sh "$RELEASE_TAG"
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN" && test -n "$DOCKERHUB_NAMESPACE"
          [[ "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          {
            echo "VERSION=${RELEASE_TAG#manage-v}"
            echo "GHCR=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/floatlab-manage:${RELEASE_TAG#manage-v}"
            echo "DOCKERHUB=docker.io/$DOCKERHUB_NAMESPACE/floatlab-manage:${RELEASE_TAG#manage-v}"
            echo "GIT_COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          python3 scripts/release.py notes "$RELEASE_TAG" > /tmp/release-notes.md
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build CLI release targets
        run: |
          pnpm commands:check
          mkdir -p release-dist
          for target in linux-x64-baseline linux-arm64 darwin-x64-baseline darwin-arm64; do
            name="${target%-baseline}"
            bun build --compile --define "__FLOATLAB_VERSION__=\"$VERSION\"" --target="bun-$target" cli/src/main.ts --outfile "release-dist/lab-$name"
          done
          test "$(release-dist/lab-linux-x64 --version)" = "$VERSION"
          release-dist/lab-linux-x64 completion bash > /tmp/lab.bash
          cmp /tmp/lab.bash cli/completions/lab.bash
      - name: Build management image once
        run: |
          docker buildx build --platform linux/amd64 --load --provenance=false --sbom=false \
            --build-arg VERSION="$VERSION" --build-arg GIT_COMMIT="$GIT_COMMIT" \
            --tag "$GHCR" --tag "$DOCKERHUB" --file docker/floatlab-control.Dockerfile .
      - name: Verify management UI and API over HTTP
        run: python3 scripts/check-manage-image.py "$GHCR" "$VERSION"
      - name: Publish verified image to both registries
        run: |
          docker push "$GHCR"
          docker push "$DOCKERHUB"
      - name: Verify registry images and publish metadata
        run: |
          mkdir -p release-dist
          python3 scripts/release.py manage-manifest "$VERSION" "$GIT_COMMIT" "$GHCR" "$DOCKERHUB" release-dist
          cd release-dist
          sha256sum lab-* manage-manifest.json > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-dist/*
          body_path: /tmp/release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.VERSION, '-') }}
