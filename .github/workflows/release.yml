name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          bun build --compile --define "__FLOATLAB_VERSION__=\"$VERSION\"" --target=bun-linux-x64-baseline cli/src/main.ts --outfile dist/floatlab-linux-x64
          bun build --compile --define "__FLOATLAB_VERSION__=\"$VERSION\"" --target=bun-linux-arm64 cli/src/main.ts --outfile dist/floatlab-linux-arm64
          bun build --compile --define "__FLOATLAB_VERSION__=\"$VERSION\"" --target=bun-darwin-x64-baseline cli/src/main.ts --outfile dist/floatlab-darwin-x64
          bun build --compile --define "__FLOATLAB_VERSION__=\"$VERSION\"" --target=bun-darwin-arm64 cli/src/main.ts --outfile dist/floatlab-darwin-arm64
          test "$(dist/floatlab-linux-x64 --version)" = "$VERSION"
          sha256sum dist/floatlab-* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
