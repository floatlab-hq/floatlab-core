name: Release

on:
  push:
    tags: ["host-v*", "manage-v*", "iso-v*"]

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate release tag
        run: |
          bash scripts/check-release-tag.sh "$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#*-v}"
          if [[ "$version" == *-* ]]; then value=true; else value=false; fi
          echo "prerelease=$value" >> "$GITHUB_OUTPUT"
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
  host:
    needs: [version, checks]
    if: startsWith(github.ref_name, 'host-v')
    uses: ./.github/workflows/release-host.yml
    with:
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
  manage:
    needs: [version, checks]
    if: startsWith(github.ref_name, 'manage-v')
    uses: ./.github/workflows/release-manage.yml
    secrets: inherit
    with:
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
  iso:
    needs: [version, checks]
    if: startsWith(github.ref_name, 'iso-v')
    uses: ./.github/workflows/release-iso.yml
    with:
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
